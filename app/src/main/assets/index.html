<!-- ============ 内置脚本（P-04 内置示例；也可在 App 内编辑覆盖） ============ -->
<script type="text/plain" data-script="demo_site" id="src-demo_site">
/* 示例站点 · 内置解析脚本（JS 后端） */
const SITE = 'https://example.com';
function T(s) { return String(s || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() }
function abs(u, base) { if (!u) return ''; if (/^https?:/.test(u)) return u; if (u.startsWith('//')) return 'https:' + u; return base + (u[0] === '/' ? u : '/' + u) }
export default {
  name: '示例站点', icon: '🌐', site: SITE, group: '示例',
  home() { return SITE + '/'; },
  search(kw) { return SITE + '/search?q=' + encodeURIComponent(kw); },
  parse(url, html) {
    const base = (String(url).match(/^https?:\/\/[^\/]+/) || [SITE])[0];
    const links = [];
    const re = /<a[^>]+href="([^"]+)"[^>]*>([\s\S]{0,300}?)<\/a>/g;
    let m;
    while ((m = re.exec(html)) && links.length < 12) {
      const u = abs(m[1], base), t = T(m[2]);
      if (u && t) links.push({ title: t, pic: '', desc: '', url: u });
    }
    return { type: 'home', heroes: [], cats: [], sections: [{ title: '示例内容', cards: links }] };
  }
}
</script>
