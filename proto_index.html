<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B1116">
<title>解析器 · 原型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0B1116;--surface:#141B22;--surface2:#1D2831;--line:#1E2831;
--txt:#E6EDF3;--txt2:#A9B6BF;--txt3:#8A8F98;--accent:#FF5A3C;
--ok:#4CAF50;--warn:#FFB300;--err:#FF5252;--info:#7DD3FC;
--r-s:8px;--r-m:12px;--r-l:16px;--r-full:999px;
}
html{height:auto;min-height:100%}
body{min-height:100vh;overflow-x:hidden;overflow-y:auto;
 background:#05080b;color:var(--txt);font:400 14px/20px -apple-system,"PingFang SC","Noto Sans SC",sans-serif;
 display:flex;justify-content:center}
#phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
/* 细滚动条（深色适配，始终可见） */
*{scrollbar-width:thin;scrollbar-color:#2f3d49 #0b1116}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0b1116}
::-webkit-scrollbar-thumb{background:#2f3d49;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3d4f5e}
@media (max-width:430px){::-webkit-scrollbar{width:5px}}
/* ---------- 布局 ---------- */
#view{padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:10px;
 padding:0 14px;background:linear-gradient(180deg,#0b1116f7,#0b1116e6 70%,transparent);
 backdrop-filter:blur(14px)}
.topbar .site{display:flex;align-items:center;gap:5px;font:800 17px/23px inherit;flex:1;min-width:0}
.topbar .site i{font-style:normal;color:var(--txt3);font-size:12px}
.topbar .ico{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--txt2)}
.dot{width:6px;height:6px;border-radius:99px;background:var(--err);display:inline-block;margin-left:4px}
/* 频道胶囊 */
.channels{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:none}
.channels::-webkit-scrollbar{display:none}
.channels b{flex:0 0 auto;padding:7px 13px;border-radius:var(--r-full);background:var(--surface);
 border:1px solid var(--line);color:#cbd5db;font:500 13px/18px inherit;transition:.12s}
.channels b.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
/* 轮播 */
.hero{position:relative;margin:4px 14px 0;height:200px;border-radius:var(--r-l);overflow:hidden;background:#101820}
.hero .s{position:absolute;inset:0;background-size:cover;background-position:center;
 opacity:0;transition:opacity .7s ease;display:flex;align-items:flex-end;padding:16px}
.hero .s.on{opacity:1}
.hero .ov{position:absolute;inset:0;background:linear-gradient(90deg,#071319e8,#07131915 62%),
 linear-gradient(0deg,#071319e0,transparent 58%)}
.hero .cap{position:relative;z-index:2;width:100%}
.hero .cap h2{font:800 20px/26px inherit;margin-bottom:5px;text-shadow:0 2px 12px #000a}
.hero .cap p{font:400 12px/17px inherit;color:#cfd9df;display:-webkit-box;-webkit-line-clamp:2;
 -webkit-box-orient:vertical;overflow:hidden}
.hero .dots{position:absolute;right:14px;bottom:16px;display:flex;gap:5px;z-index:3}
.hero .dots i{width:6px;height:6px;border-radius:99px;background:#fff6;transition:.3s}
.hero .dots i.on{width:16px;background:#fff}
/* 分区 */
.sec{padding:16px 14px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-h h3{font:700 17px/23px inherit;display:flex;align-items:center;gap:6px}
.sec-h h3::before{content:'';width:3px;height:15px;border-radius:2px;background:var(--accent)}
.sec-h s{font:400 12px/17px inherit;color:var(--txt3);text-decoration:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:var(--r-m);overflow:hidden;transition:.15s}
.card:active{transform:scale(.975)}
.card .ph{position:relative;aspect-ratio:16/10;overflow:hidden}
.card .ph .g{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
 font:800 28px/1 inherit;color:#ffffff3d}
.card .ph em{position:absolute;right:6px;bottom:6px;font:400 10px/14px inherit;font-style:normal;
 background:#000a;padding:2px 6px;border-radius:5px;color:#e2eaef}
.card .tt{padding:8px 9px 10px;font:400 13px/18px inherit;color:#e2e9ee;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 通用 */
.row{display:flex;align-items:center;height:56px;padding:0 16px;gap:12px;
 border-bottom:1px solid var(--line);background:var(--surface)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0;font:400 14px/20px inherit}
.row .t small{display:block;color:var(--txt3);font-size:11px;line-height:15px;margin-top:2px}
.row .v{color:var(--txt3);font-size:12px}
.row .arw{color:var(--txt3);font-size:16px}
.group{margin:12px 14px;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}
.group .gh{padding:8px 16px 4px;font:700 12px/17px inherit;color:var(--txt3);letter-spacing:.4px}
.seg{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:var(--r-s)}
.seg b{flex:1;text-align:center;font:500 12px/16px inherit;padding:6px 0;border-radius:6px;color:var(--txt2)}
.seg b.on{background:var(--accent);color:#fff;font-weight:700}
.sw{width:44px;height:26px;border-radius:99px;background:#2a3742;position:relative;flex:0 0 auto;transition:.15s}
.sw.on{background:var(--accent)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;
 background:#fff;transition:.15s}
.sw.on::after{left:21px}
.btn{height:44px;border-radius:var(--r-m);display:flex;align-items:center;justify-content:center;
 gap:6px;font:700 15px/1 inherit;background:var(--accent);color:#fff}
.btn.g{background:var(--surface);color:var(--txt);border:1px solid var(--line);font-weight:500}
.btn.d{background:#3a1f1f;color:#ff8a80}
.muted{color:var(--txt3)}
.pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;line-height:14px}
.pill.ok{background:#12351f;color:#6ee7a0}
.pill.bl{background:#122a3a;color:#7dd3fc}
.pill.rd{background:#3a1f1f;color:#ff8a80}
/* Tab bar */
#tabs{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;height:56px;
 display:flex;background:#0b1116f2;border-top:1px solid var(--line);backdrop-filter:blur(14px);z-index:40;
 padding-bottom:env(safe-area-inset-bottom)}
#tabs div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
 font:400 10px/14px inherit;color:var(--txt3)}
#tabs div.on{color:var(--accent)}
#tabs div span{font-size:19px;line-height:1}
/* 宫格 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 14px}
.tile{height:92px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.tile:active{background:var(--surface2)}
.tile b{font-size:26px;line-height:1}
.tile s{font:400 12px/16px inherit;text-decoration:none;color:var(--txt2)}
.tile i{position:absolute;top:8px;right:9px;font:400 10px/1 inherit;font-style:normal;color:var(--txt3)}
/* 浮层 */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
#sheet .mask{position:absolute;inset:0;background:#000a;backdrop-filter:blur(2px)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;
 background:var(--bg);border-radius:var(--r-l) var(--r-l) 0 0;padding:8px 0 24px;
 max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
 transform:translateY(100%);transition:transform .28s ease;
 padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#sheet.on .pane{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:99px;background:#2c3a45;margin:6px auto 10px;
 position:sticky;top:0;z-index:2}
#sb{position:fixed;right:2px;top:0;bottom:0;width:4px;z-index:120;pointer-events:none;
 opacity:0;transition:opacity .25s}
#sb.on{opacity:1}
#sb i{position:absolute;left:0;width:100%;border-radius:3px;background:#5a6b7a;
 transition:top .05s linear}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);z-index:90;
 background:#000000e6;color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;opacity:0;
 transition:.2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 骨架 */
.sk{background:linear-gradient(90deg,#141b22,#1d2831,#141b22);background-size:200% 100%;
 animation:sk 1.2s linear infinite;border-radius:var(--r-m)}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* 其他 */
.empty{padding:60px 24px;text-align:center;color:var(--txt3)}
.empty b{display:block;font-size:44px;margin-bottom:12px;opacity:.55}
.empty p{font-size:13px;line-height:20px;margin-bottom:16px}
.term{background:#080d11;border-radius:var(--r-m);margin:12px 14px;padding:12px;height:340px;overflow:auto;
 font:400 13px/19px ui-monospace,Menlo,monospace;color:#c8e1ff;white-space:pre-wrap}
.term .r{color:#ff8a65}
.term .ok{color:#6ee7a0}
.termbar{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.termbar::-webkit-scrollbar{display:none}
.termbar b{flex:0 0 auto;padding:8px 12px;border-radius:var(--r-s);background:var(--surface);
 border:1px solid var(--line);font:500 12px/16px inherit;color:var(--txt2)}
.code{background:#080d11;border-radius:var(--r-m);margin:12px 14px;padding:12px;height:420px;overflow:auto;
 font:400 12px/18px ui-monospace,Menlo,monospace;color:#c8e1ff;white-space:pre;tab-size:4}
.bar{height:3px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 16px}
.bar i{display:block;height:100%;background:var(--accent)}
.back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--txt)}
.listline{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.listline .ic{width:34px;height:34px;border-radius:9px;background:var(--surface2);display:flex;
 align-items:center;justify-content:center;font-size:16px}
.listline .n{flex:1;min-width:0}
.listline .n b{font:500 13px/18px inherit;display:block}
.listline .n small{color:var(--txt3);font-size:11px;line-height:15px}
</style></head><body>
<div id="phone">
  <div id="view"></div>
  <div id="tabs">
    <div data-t="app"><span>🏠</span>主页</div>
    <div data-t="browse"><span>🌐</span>浏览</div>
    <div data-t="fav"><span>❤️</span>收藏</div>
    <div data-t="mine"><span>👤</span>我的</div>
  </div>
</div>
<div id="sheet"><div class="mask" onclick="closeSheet()"></div><div class="pane" id="pane"></div></div>
<div id="sb"><i id="sbi"></i></div>
<div id="toast"></div>
<script>
/* ===================== mock 数据 ===================== */
const GRAD=['linear-gradient(135deg,#ff6b6b,#c92a2a)','linear-gradient(135deg,#4dabf7,#1864ab)',
'linear-gradient(135deg,#51cf66,#2b8a3e)','linear-gradient(135deg,#fcc419,#e67700)',
'linear-gradient(135deg,#b197fc,#6741d9)','linear-gradient(135deg,#ff8787,#e03131)',
'linear-gradient(135deg,#38d9a9,#087f5b)','linear-gradient(135deg,#ffa94d,#d9480f)'];
const TITLES=['我在緬北當高階主管','OL女友雪莉肉棒調教','被同學強暴的巨乳媽媽 第二季','嫂子別走',
'辦公室秘書的秘密','鄰家姐姐的誘惑','深夜計程車司機','實習生的第一天','溫泉旅館的邂逅','深夜食堂的常客',
'學妹的補習時間','總裁的私人保鑣'];
const SITES=[{id:'demo_site',name:'示例站点',domain:'example.com',icon:'🔥',desc:'9 个分区 · 5 分钟前更新',on:1},
 {id:'manga_x',name:'某漫画站',domain:'manga.example',icon:'📚',desc:'已停用',on:0},
 {id:'pic_y',name:'某图站',domain:'pic.example',icon:'🖼',desc:'3 个分区 · 昨天',on:1}];
let HOME_CFG={welcome:1,cards:1,sites:1,recent:1,notice:1,cardsLayout:'row',siteLayout:'list'};
const HOME={heroes:[
 {title:'我在緬北當高階主管',desc:'AI短劇 · 全2集 · 近一小時最熱一集 384 次觀看',url:'detail'},
 {title:'隱身，目標操校花',desc:'短劇 · 全12集 · 1.2萬次觀看',url:'detail'},
 {title:'被同學強暴的巨乳媽媽 第二季',desc:'日本 · 全8集',url:'detail'}],
 cats:['首页','國產AV','探花','自拍流出','日本','OnlyFans','AI短劇','中文字幕'],
 sections:[
  {title:'國產AV',n:8},{title:'探花',n:6},{title:'日本',n:6}]};
const MODULES=[{pkg:'requests',ver:'2.34.2',lv:'pure',sz:'58 KB'},
 {pkg:'lxml',ver:'6.1.3',lv:'android',sz:'9.4 MB'},
 {pkg:'numpy',ver:'2.5.5',lv:'android',sz:'14.2 MB'}];
const SCRIPTS=[{id:'demo_site',name:'示例站点',lang:'PY',dom:'example.com',on:1,sec:271},
 {id:'manga_x',name:'某漫画站',lang:'PY',dom:'manga.example',on:0,sec:132}];

/* ===================== 路由 ===================== */
let STACK=[], CURTAB='home';
function go(fn,opts){ STACK.push({fn:fn}); renderTop(); if(!opts||!opts.keepScroll) window.scrollTo(0,0); }
function back(){ if(STACK.length){STACK.pop(); renderTop(); } }
function re(){ if(STACK.length){ STACK[STACK.length-1].fn(); } else { TABS[CURTAB](); } }
function renderTop(){ const t=STACK.length?STACK[STACK.length-1].fn:TABS[CURTAB]; t(); if(window.updSB)setTimeout(updSB,30); }
const TABS={};

/* ===================== 组件片段 ===================== */
function ph(i,t){ return `<div class=g style="background:${GRAD[i%GRAD.length]}">${(t||'肉').slice(0,1)}</div>`; }
function card(i,t,dur){ return `<div class=card onclick="go(()=>pgDetail(${i}))">
  <div class=ph>${ph(i,t)}${dur?`<em>${dur}</em>`:''}</div>
  <div class=tt>${t}</div></div>`; }
function topbar(title,site){ return `<div class=topbar>
  ${title?'<div class=back onclick="back()">‹</div>':''}
  ${site?`<div class="site" onclick="openSite()">${site}<i>▾</i></div>`:`<div class=site>${title}</div>`}
  ${site?'<div class=ico" onclick="go(()=>pgSearch())">🔍</div><div class=ico onclick="openMore()">⋮</div>':''}
</div>`; }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on');
 clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1600); }
function openSheet(html){ document.getElementById('pane').innerHTML=
  '<div class=grab></div>'+html; document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
function openSite(){ openSheet(`<div style="padding:6px 8px 2px 18px;font:700 12px/17px inherit;color:var(--txt3)">切换站点</div>`
 + SITES.map(s=>`<div class=row onclick="pickSite('${s.name}')"><div class=t>${s.name}<small>${s.domain}</small></div>
   ${CURTAB==='home'?'<span class=pill ok>使用中</span>':''}<div class=arw>›</div></div>`).join('')
 + `<div class=row onclick="closeSheet();go(()=>pgScripts())"><div class=t>＋ 管理脚本</div><div class=arw>›</div></div>`); }
function pickSite(n){ closeSheet(); CUR_SITE=n; toast('已切到 '+n); STACK=[]; TABS.browse(); }
function openMore(){ openSheet(`<div class=row onclick="closeSheet();go(()=>pgSettings())"><div class=t>设置</div><div class=arw>›</div></div>
 <div class=row onclick="closeSheet();toast('已刷新')"><div class=t>刷新当前页</div><div class=arw>›</div></div>
 <div class=row onclick="closeSheet();openSite()"><div class=t>切换站点</div><div class=arw>›</div></div>
 <div class=row onclick="closeSheet();go(()=>pgAbout())"><div class=t>关于</div><div class=arw>›</div></div>`); }

/* ===================== T-1 主页（应用门面） ===================== */
let heroIdx=0, heroTimer=null;

TABS.app=function(){
  clearInterval(heroTimer);
  const cfg=HOME_CFG;
  const v=document.getElementById('view');
  v.innerHTML=`
   <div class=topbar>
     <div class=site style="flex:1"><b style="font:800 18px/24px inherit">解析器</b>
       <span style="font-size:11px;color:var(--txt3);margin-left:2px">v1.0</span></div>
     <div class="site" onclick="openSite()" style="flex:0 0 auto;font:600 14px/20px inherit">
       示例站点<i>▾</i></div>
     <div class=ico onclick="editHome()">🎨</div>
   </div>
   ${cfg.welcome?`<div style="padding:6px 16px 14px">
     <div style="font:800 22px/29px inherit;margin-bottom:6px">可编程解析客户端</div>
     <div style="font-size:12px;line-height:19px;color:var(--txt2)">
       内置完整 Python 解释器 · 一个脚本就是一个站点<br>
       脚本可在手机里写、改、调、装包</div>
   </div>`:''}
   ${cfg.cards?`<div style="padding:0 14px">
     <div style="display:grid;grid-template-columns:repeat(${cfg.cardsLayout==='row'?3:2},1fr);gap:10px">
       ${[['🐍','终端','调试','go(()=>pgTerm())'],['📦','模块','3','go(()=>pgModules())'],
          ['📜','脚本','2','go(()=>pgScripts())'],['⚙️','设置','','go(()=>pgSettings())'],
          ['🧹','缓存','12.4M',"toast('已清理 12.4 MB')"],['📋','日志','',"go(()=>pgLogs())"]]
         .map(c=>`<div class=tile onclick="${c[3]}" style="height:${cfg.cardsLayout==='row'?'80px':'92px'}">
            <b>${c[0]}</b><s>${c[1]}</s>${c[2]?`<i>${c[2]}</i>`:''}</div>`).join('')}
     </div></div>`:''}
   ${cfg.sites?`<div class=sec><div class=sec-h><h3>我的站点</h3>
       <s onclick="go(()=>pgScripts())">管理 ›</s></div>
     ${cfg.siteLayout==='list'
       ? SITES.map((x,i)=>`<div class=card style="margin-bottom:10px" onclick="openSiteTab(${i})">
           <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:${GRAD[i%GRAD.length]}1a">
             <div style="width:44px;height:44px;border-radius:12px;background:${GRAD[i%GRAD.length]};
               display:flex;align-items:center;justify-content:center;font-size:20px">${x.icon}</div>
             <div style="flex:1;min-width:0">
               <div style="font:700 15px/21px inherit;display:flex;align-items:center;gap:6px">${x.name}
                 ${x.on?'<span class="pill ok">启用</span>':'<span class="pill">停用</span>'}</div>
               <div style="font-size:11px;color:var(--txt3);margin-top:2px">${x.domain} · ${x.desc}</div>
             </div>
             <div class=arw>→</div></div></div>`).join('')
       : `<div class=grid>${SITES.map((x,i)=>`<div class=card onclick="openSiteTab(${i})">
            <div class=ph><div class=g style="background:${GRAD[i%GRAD.length]}">${x.icon}</div></div>
            <div class=tt>${x.name}<div style="font-size:11px;color:var(--txt3);margin-top:2px">${x.domain}</div></div>
           </div>`).join('')}</div>`}
     <div class=row style="margin-top:8px;border:1px dashed var(--line);border-radius:12px;height:48px;justify-content:center;
        color:var(--txt3);font-size:13px" onclick="go(()=>pgNewScript())">＋ 添加站点（新建脚本）</div>
   </div>`:''}
   ${cfg.recent?`<div class=sec><div class=sec-h><h3>继续观看</h3><s>全部 ›</s></div>
     <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px">
       ${[0,3,5].map(i=>`<div style="flex:0 0 128px" onclick="go(()=>pgDetail(${i}))">
         <div style="aspect-ratio:16/10;border-radius:10px;background:${GRAD[i%GRAD.length]};margin-bottom:6px"></div>
         <div style="font-size:12px;line-height:17px;color:var(--txt2);display:-webkit-box;-webkit-line-clamp:2;
           -webkit-box-orient:vertical;overflow:hidden">${TITLES[i]}</div>
         <div style="height:3px;border-radius:9px;background:var(--surface2);margin-top:5px">
           <i style="display:block;height:100%;width:${35+i*15}%;background:var(--accent);border-radius:9px"></i></div>
       </div>`).join('')}
     </div></div>`:''}

     </div>
     <div style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">
       <video id=pv controls playsinline preload="metadata"
         style="display:block;width:100%;max-height:100%;background:#000"></video>
       <div id=pvmsg style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         color:#8a8f98;font-size:12px;pointer-events:none;background:#000a">正在加载测试源…</div>
     </div>
     <div style="flex:0 0 auto;background:#0d141a;border-top:1px solid #1a2229">
       <div style="display:flex;align-items:center;gap:10px;padding:8px 14px 2px">
         <span id=ptime style="font:400 11px/16px ui-monospace,monospace;color:#8a8f98">00:00</span>
         <div id=pseek style="flex:1;height:3px;border-radius:9px;background:#2a3742;position:relative"
           onclick="seekTo(event)">
           <i id=pbar style="position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:9px"></i>
         </div>
         <span id=pdur style="font:400 11px/16px ui-monospace,monospace;color:#8a8f98">--:--</span>
       </div>
       <div style="display:flex;gap:8px;overflow-x:auto;padding:6px 14px 12px;scrollbar-width:none">
         <b onclick="cycleRate()" style="flex:0 0 auto;padding:7px 12px;border-radius:8px;background:#1a2229;
           color:#c8d4de;font:500 12px/16px inherit">倍速 <span id=prate>1.0</span>×</b>
         <b onclick="toggleSub()" style="flex:0 0 auto;padding:7px 12px;border-radius:8px;background:#1a2229;
           color:#c8d4de;font:500 12px/16px inherit">字幕</b>
         <b onclick="toast('选源：线路2')" style="flex:0 0 auto;padding:7px 12px;border-radius:8px;background:#1a2229;
           color:#c8d4de;font:500 12px/16px inherit">选源</b>
         <b onclick="toast('已记录片头结束点 95s')" style="flex:0 0 auto;padding:7px 12px;border-radius:8px;
           background:#1a2229;color:#c8d4de;font:500 12px/16px inherit">设片头</b>
         <b onclick="toast('已记录片尾开始点 1380s')" style="flex:0 0 auto;padding:7px 12px;border-radius:8px;
           background:#1a2229;color:#c8d4de;font:500 12px/16px inherit">设片尾</b>
       </div>
     </div>
   </div>`;
  const v=document.getElementById('pv'), msg=document.getElementById('pvmsg');
  const bar=document.getElementById('pbar')||document.querySelector('#pseek i');

    if(k>=TEST_SRCS.length){ msg.style.display='flex'; msg.textContent='测试源不可达 · 正式版接站点真实直链'; return; }
    v.src=TEST_SRCS[k++]; v.load();
    v.play().then(()=>{ msg.style.display='none'; }).catch(()=>{});
  }
  v.addEventListener('error',tryNext);
  v.addEventListener('loadedmetadata',()=>{ msg.style.display='none';
    dur.textContent=fmt(v.duration); });

function fmt(t){ if(!isFinite(t))return '--:--';

function seekTo(e){ const el=document.getElementById('pseek'); const v=document.getElementById('pv');

  const r=el.getBoundingClientRect();
  v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v.duration; }
function cycleRate(){ const v=document.getElementById('pv'); if(!v)return;
  const seq=[1,1.25,1.5,2,0.75];

  v.playbackRate=nxt;
  const el=document.getElementById('prate'); if(el)el.textContent=nxt.toFixed(1).replace('.0','');
  toast('倍速 '+nxt+'×'); }

  openSheet(`<div style="padding:0 10px 8px">

    <div class=row onclick="closeSheet();toast('help：ls cd pwd cat grep find py pip curl site')"><div class=t>可用命令帮助</div></div>
  </div>`);

function termKey(k){ const inp=document.getElementById('tin');
  if(!inp)return;
  if(k==='Ctrl'){ inp.value+='^'; inp.focus(); toast('Ctrl 按下，再按字母（模拟）'); return; }
  if(k==='Tab'){ const v=(inp.value||'').trim();
    const cand=['ls','cd','cat','py','pip install ','pip list','site list','help','clear'].filter(c=>c.startsWith(v));
    if(cand.length===1) inp.value=cand[0]; if(cand.length>1) toast('候选：'+cand.join(' '));
    inp.focus(); return; }
  if(k==='↑'||k==='↓'){ toast('历史：'+(k==='↑'?'上一条':'下一条')); return; }
  if(k==='⌫'){ inp.value=(inp.value||'').slice(0,-1); inp.focus(); return; }
  if(k==='⏎'){ runTerm(); return; }
  inp.value+=(k.length===1?'':''); inp.focus();
}
function runTerm(){
  const inp=document.getElementById('tin'), v=(inp.value||'').trim();
  if(!v)return;
  inp.value='';
  if(TERM_MODE==='py'){
    TERM_LINES.push('>>> '+v);
    if(/^1\/0$/.test(v)) TERM_LINES.push('Traceback (most recent call last):\n  ZeroDivisionError: division by zero');
    else if(/^\d+([+\-*/]\d+)*$/.test(v)){ try{ TERM_LINES.push(String(eval(v))); }catch(e){ TERM_LINES.push('Error'); } }
    else if(/^import /i.test(v)) TERM_LINES.push('(已导入)');
    else TERM_LINES.push('(执行完成)');
  } else {
    TERM_LINES.push('$ '+v);
    const c=v.split(/\s+/);
    if(c[0]==='ls') TERM_LINES.push('scripts/   pkg/   cache/   sites/');
    else if(c[0]==='cd') TERM_LINES.push('→ '+ (c[1]||'~'));
    else if(c[0]==='pwd') TERM_LINES.push('/data/user/0/com.rou.parser/files');
    else if(c[0]==='cat') TERM_LINES.push('# '+ (c[1]||'文件') +' 内容…');
    else if(c[0]==='py'){ TERM_MODE='py'; TERM_LINES.push('Python 3.13.9 (CPython) · Ctrl+D 退出'); }
    else if(c[0]==='pip'){
      if(c[1]==='install') { TERM_LINES.push('检测 '+(c[2]||'')+' … 🟢 纯 Python'); TERM_LINES.push('下载 whl → 解压 → sys.path OK'); }
      else if(c[1]==='list') TERM_LINES.push('requests 2.34.2  lxml 6.1.3  numpy 2.5.5');
      else TERM_LINES.push('用法: pip install|list|uninstall');
    }
    else if(c[0]==='help') TERM_LINES.push('ls cd pwd cat mkdir rm cp mv find grep py pip curl site help clear history');
    else if(c[0]==='site') TERM_LINES.push(c[1]==='list'?'demo_site(示例站点)  manga_x(某漫画站, 停用)':'site test → 抓到 24 条');
    else if(c[0]==='clear'){ TERM_LINES=[]; }
    else if(c[0]==='history') TERM_LINES.push('ls / py / pip install lxml');
    else TERM_LINES.push('命令不存在: '+c[0]+'（键入 help 看列表）');
  }
  termRender();
}

/* ===================== 滚动指示条 ===================== */
function updSB(){
  const sb=document.getElementById('sb'), th=document.getElementById('sbi');
  if(!sb||!th)return;
  const d=document.documentElement;
  const h=Math.max(d.scrollHeight, document.body.scrollHeight);
  const vh=window.innerHeight, y=window.scrollY||d.scrollTop||0;
  if(h<=vh+8){ sb.classList.remove('on'); return; }
  const thumb=Math.max(30, Math.round(vh*vh/h));
  const maxTop=h-vh, range=vh-thumb;
  th.style.height=thumb+'px';
  th.style.top=Math.round(maxTop>0?(y/maxTop)*range:0)+'px';
  sb.classList.add('on');
}
window.addEventListener('scroll',updSB,{passive:true});
window.addEventListener('resize',updSB);
setInterval(updSB,600);

/* ===================== 初始化 ===================== */
TABS.app();
setTimeout(updSB,100);
